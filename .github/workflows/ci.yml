name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, Lint, Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jewellery
          POSTGRES_PASSWORD: jewellery_ci_pass
          POSTGRES_DB: jewellery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jewellery:jewellery_ci_pass@localhost:5432/jewellery?schema=public
      DIRECT_URL: postgresql://jewellery:jewellery_ci_pass@localhost:5432/jewellery?schema=public
      BETTER_AUTH_SECRET: ci_only_secret_at_least_32_characters_long_123
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Shinora Jewels
      PAYMENT_PROVIDER: stripe
      PAYMENT_TEST_SANDBOX: "true"
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: jewellery-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin123
      NEXT_PUBLIC_IMAGE_CDN_URL: http://localhost:9000/jewellery-media
      EMAIL_FROM: concierge@example.com
      ADMIN_NOTIFY_EMAIL: admin@example.com
      CRON_SECRET: ci_cron_secret
      MERCHANT_FEED_TOKEN: ci_merchant_token
      SEED_DEMO_DATA: "true"
      ADMIN_SEED_EMAIL: admin@example.com
      ADMIN_SEED_PASSWORD: AdminChangeMe123!

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050b480ffad5ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client & run migrations
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint & Format Check
        run: |
          npm run lint
          npm run format:check

      - name: Build Production App
        run: npm run build

      - name: Security Audit
        run: npm audit --audit-level=high || true
